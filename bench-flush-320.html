<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/vendor-2803/lattice-grid.min.css"><style>html,body{margin:0;height:100%}#g{width:1600px;height:1000px;--lattice-border-width:0px;--lattice-cell-padding-x:0px;--lattice-cell-padding-y:0px}#g .lat-cell{font-size:0;color:transparent}</style></head>
<body><div id="g"></div>
<script type="module">
const { createGrid } = await import('/vendor-2803/lattice-grid.esm.min.js');
const COLS = 320, ROWS = 200;
const columns = Array.from({ length: COLS }, (_, c) => ({ field: 'c' + c, title: '', sort: false, filter: false, value: { format: () => '' }, layout: { width: 5, min: 5 } }));
const rows = Array.from({ length: ROWS }, (_, r) => { const o = { id: r }; for (let c = 0; c < COLS; c++) o['c' + c] = '#000000'; return o; });
const grid = createGrid(document.getElementById('g'), { columns, rows, rowKey: 'id', showHeader: false, gridLines: 'none', selection: 'none', rowHeight: 5, density: 'compact', formatting: { '*': [{ when: { op: 'notBlank' }, style: (p) => ({ background: String(p.value) }) }] } });
await new Promise(r => setTimeout(r, 500));
const hex = (i) => '#' + ((i * 2654435761) >>> 8).toString(16).padStart(6, '0').slice(0, 6);
const rgbOf = (h) => `rgb(${parseInt(h.slice(1,3),16)}, ${parseInt(h.slice(3,5),16)}, ${parseInt(h.slice(5,7),16)})`;
let seed = 1; const out = []; let timeouts = 0;
for (const cells of [3200, 32000]) {
  const times = [];
  for (let f = 0; f < 15; f++) {
    const perRow = cells / ROWS; const updates = []; let probe = null;
    for (let r = 0; r < ROWS; r++) { const u = { id: r }; for (let k = 0; k < perRow; k++) { const col = (k + f) % COLS; u['c' + col] = hex(seed++); if (r === ROWS - 1 && k === perRow - 1) probe = { r, col, v: u['c' + col] }; } updates.push(u); }
    const t0 = performance.now();
    grid.rows.apply({ update: updates });
    // wait until the probed cell actually shows the new colour on screen (DOM flushed + styles applied), then one more frame
    const rowEl = document.querySelectorAll('#g .lat-row')[probe.r];
    await new Promise((resolve) => { const giveUp = performance.now() + 2000; const check = () => { const cell = rowEl && rowEl.querySelectorAll('.lat-cell')[probe.col]; if (cell && getComputedStyle(cell).backgroundColor === rgbOf(probe.v)) resolve(); else if (performance.now() > giveUp) { timeouts = (timeouts || 0) + 1; resolve(); } else requestAnimationFrame(check); }; requestAnimationFrame(check); });
    await new Promise(r => requestAnimationFrame(r));
    times.push(performance.now() - t0);
  }
  times.sort((a, b) => a - b);
  out.push(`lattice 2803 build, 320x200 styled: ${cells} cells -> apply+flush median ${times[7].toFixed(1)} ms (min ${times[0].toFixed(1)}, max ${times[14].toFixed(1)})`);
}
out.push('timeouts: ' + timeouts); window.__out = out; document.title = 'done';
</script></body></html>
