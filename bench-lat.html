<body><div id="g"></div>
<script type="module">
const { createGrid } = await import('/node_modules/@toclocoinc/lattice-grid/lattice-grid.esm.min.js');

const rows = Array.from({ length: ROWS }, (_, r) => { const o = { id: r }; for (let c = 0; c < COLS; c++) o['c' + c] = '#000000'; return o; });

  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

window.__out = out; document.title = 'done';
</script></body></html>
