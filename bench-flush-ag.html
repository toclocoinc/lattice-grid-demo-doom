<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%}#g{width:1600px;height:500px}#g .ag-cell,#g .ag-row{padding:0;border:none;--ag-row-border:0px}</style>
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@36.1.0/dist/ag-grid-community.min.js"></script></head>
<body><div id="g" class="ag-theme-quartz"></div>
<script type="module">
const COLS = 80, ROWS = 50;
const columnDefs = Array.from({ length: COLS }, (_, c) => ({ field: 'c' + c, flex: 1, minWidth: 4, sortable: false, resizable: false, suppressMovable: true, cellStyle: (p) => ({ backgroundColor: p.value }), valueFormatter: () => '' }));
const rowData = Array.from({ length: ROWS }, (_, r) => { const o = { id: r }; for (let c = 0; c < COLS; c++) o['c' + c] = '#000000'; return o; });
const api = agGrid.createGrid(document.getElementById('g'), { columnDefs, rowData, getRowId: (p) => String(p.data.id), headerHeight: 0, rowHeight: 10, animateRows: false, suppressCellFocus: true, suppressColumnVirtualisation: true, suppressRowVirtualisation: true });
await new Promise(r => setTimeout(r, 1500));
const hex = (i) => '#' + ((i * 2654435761) >>> 8).toString(16).padStart(6, '0').slice(0, 6);
const rgbOf = (h) => `rgb(${parseInt(h.slice(1,3),16)}, ${parseInt(h.slice(3,5),16)}, ${parseInt(h.slice(5,7),16)})`;
let seed = 1; const out = []; let timeouts = 0;
for (const cells of [900, 4000]) {
  const times = [];
  for (let f = 0; f < 15; f++) {
    const perRow = cells / ROWS; const updates = []; let probe = null;
    for (let r = 0; r < ROWS; r++) { const u = { id: r }; for (let k = 0; k < perRow; k++) { const col = (k + f) % COLS; u['c' + col] = hex(seed++); if (r === ROWS - 1 && k === perRow - 1) probe = { r, col, v: u['c' + col] }; } updates.push(u); }
    const t0 = performance.now();
    api.applyTransaction({ update: updates });
    await new Promise((resolve) => { const giveUp = performance.now() + 2000; const check = () => { const cell = document.querySelector(`#g [row-id="${probe.r}"] [col-id="c${probe.col}"]`); if (cell && getComputedStyle(cell).backgroundColor === rgbOf(probe.v)) resolve(); else if (performance.now() > giveUp) { timeouts = (timeouts || 0) + 1; resolve(); } else requestAnimationFrame(check); }; requestAnimationFrame(check); });
    await new Promise(r => requestAnimationFrame(r));
    times.push(performance.now() - t0);
  }
  times.sort((a, b) => a - b);
  out.push(`other grid, 80x50 cellStyle: ${cells} cells -> apply+flush median ${times[7].toFixed(1)} ms (min ${times[0].toFixed(1)}, max ${times[14].toFixed(1)})`);
}
out.push('timeouts: ' + timeouts); window.__out = out; document.title = 'done';
</script></body></html>
